<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <title>Recipe — The Sleeping Cat Farm</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/sections.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body class="inner-page">

<!-- NAV -->
<nav id="navbar" class="scrolled">
  <a href="../index.html" class="nav-logo-wrapper">
    <img src="../assets/icons/farm-logo.svg" alt="The Sleeping Cat Farm Logo" class="nav-logo-icon">
    <div class="nav-logo"></div>
  </a>
  <ul class="nav-links" id="nav-links"></ul>
  <button class="nav-hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="nav-overlay"></div>

<!-- RECIPE HERO (gradient banner) -->
<section class="page-hero" id="recipe-hero">
  <div class="section-label">Recipe</div>
  <h2 class="section-title" id="recipe-hero-title"></h2>
  <p  class="section-desc"  id="recipe-hero-meta"></p>
</section>

<!-- RECIPE DETAIL -->
<div class="page-body">
  <div class="recipe-detail-section" id="recipe-detail">
    <!-- Populated by JS -->
  </div>
</div>

<!-- FOOTER -->
<footer id="contact">
  <div class="footer-bottom">
    <span id="footer-copyright"></span>
    <div  class="social-links" id="footer-social-logo"></div>
  </div>
</footer>

<!-- SCRIPTS -->
<script src="../js/config.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/render.js"></script>
<script src="../js/animations.js"></script>
<script>
(function() {
  // Determine recipe from filename
  const filename = window.location.pathname.split('/').pop();
  const slug     = filename.replace('recipe-', '').replace('.html', '');
  const recipe   = SITE_CONFIG.recipes.find(r => r.slug === slug);

  if (!recipe) {
    document.title = 'Recipe Not Found';
    document.getElementById('recipe-detail').innerHTML =
      '<p style="text-align:center; color:#999;">Recipe not found. <a href="recipes.html">← Back to Recipes</a></p>';
    renderBrand(); renderNav(); renderFooter(); renderSocial(); initAnimations();
    return;
  }

  // Page title & hero
  document.title = `${recipe.title.replace(/&amp;/g,'&')} — The Sleeping Cat Farm`;
  document.getElementById('recipe-hero-title').innerHTML = recipe.title;
  document.getElementById('recipe-hero-meta').textContent =
    `${recipe.category} · ${recipe.time} · Serves ${recipe.servings}`;

  // Recipe detail body
  const detailEl = document.getElementById('recipe-detail');
  detailEl.innerHTML =
    `<!-- Intro -->
     <p class="recipe-intro">${recipe.intro}</p>

     <!-- Two column: Ingredients + Method -->
     <div class="recipe-two-col">
       <!-- Ingredients -->
       <div>
         <h4>Ingredients</h4>
         <ul class="ingredient-list">
           ${recipe.ingredients.map(i => `<li>${i}</li>`).join('')}
         </ul>
       </div>

       <!-- Method -->
       <div>
         <h4>Method</h4>
         <ol class="method-list">
           ${recipe.method.map(step => `<li>${step}</li>`).join('')}
         </ol>
       </div>
     </div>

     <!-- Back link -->
     <a href="recipes.html" style="display:inline-block; margin-top:2rem; font-size:.72rem; color:var(--text-muted); text-decoration:none; letter-spacing:.1em; text-transform:uppercase;">← Back to All Recipes</a>`;

  // Shared renders
  renderBrand();
  renderNav();
  renderFooter();
  renderSocial();
  initAnimations();
})();
</script>

</body>
</html>
