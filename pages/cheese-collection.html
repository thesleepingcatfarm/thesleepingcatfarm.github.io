<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <title>Cheese Collection - The Sleeping Cat Farm</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/sections.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>

<body class="inner-page">

  <!-- NAV -->
  <nav id="navbar" class="scrolled">
    <a href="../index.html" class="nav-logo-wrapper">
      <img src="../assets/icons/farm-logo.svg" alt="The Sleeping Cat Farm Logo" class="nav-logo-icon">
      <div class="nav-logo"></div>
    </a>
    <ul class="nav-links" id="nav-links"></ul>
    <button class="nav-hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>
  <div class="nav-overlay"></div>

  <!-- PAGE HERO -->
  <section class="page-hero" style="padding-bottom: 20px;">
    <h2 class="section-title" style="margin-top: 20px;">Explore our <em>Cheese</em> Collection</h2>
    <p class="section-desc" style="margin-bottom: 20px;">Each variety has its own story, its own temperament, its own
      moment to shine. Discover our complete collection of hand-crafted artisanal cheeses.</p>
    <div style="padding: var(--space-xl) var(--space-lg); background: var(--cream); padding-top: 50px;">
      <div class="cheese-grid" id="cheese-grid" style="grid-template-columns: repeat(3, 1fr);"></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer id="contact">
    <div class="footer-bottom">
      <span id="footer-copyright"></span>
      <div class="social-links" id="footer-social-logo"></div>
    </div>
  </footer>

  <!-- SCRIPTS -->
  <script src="../js/config.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/render.js"></script>
  <script src="../js/animations.js"></script>
  <script>
    (function () {
      // Render all cheese cards with Add to Cart buttons
      const grid = document.getElementById('cheese-grid');
      grid.innerHTML = SITE_CONFIG.products.map(product => {
        const detailUrl = `product-${product.slug}.html`;

        const imgInner = product.image
          ? `<img src="${product.image}" alt="${product.name}" class="card-photo"
            onerror="this.style.display='none';this.nextElementSibling.style.display='block';this.nextElementSibling.nextElementSibling.style.display='block';" />
         <div class="card-bg" style="display:none;"></div>
         <div class="cheese-wheel" style="display:none;"></div>`
          : `<div class="card-bg"></div><div class="cheese-wheel"></div>`;

        return `<div class="cheese-card card-${product.cardStyle} reveal">
              <a href="${detailUrl}" style="text-decoration:none; color:inherit;">
                <div class="cheese-card-img">${imgInner}</div>
                <div class="cheese-card-body">
                  <div class="cheese-type">${product.type}</div>
                  <h3>${product.name}</h3>
                  <p>${product.desc}</p>
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-top:.3rem;">
                    <span class="price">${product.price}</span>
                  </div>
                </div>
              </a>
              <div style="padding: 0 1.5rem 1.2rem;">
                <button class="btn-add-cart btn-add-cart-sm" style="width:100%;" data-slug="${product.slug}">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                  </svg>
                  Add to Cart
                </button>
              </div>
            </div>`;
      }).join('');

      // Event delegation for Add to Cart buttons
      grid.addEventListener('click', function (e) {
        var btn = e.target.closest('.btn-add-cart');
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        var slug = btn.dataset.slug;
        var product = SITE_CONFIG.products.find(function (p) { return p.slug === slug; });
        if (product) {
          Cart.addItem(product);
        }
      });

      // Shared renders
      renderProductsHTML();
      renderBrand();
      renderNav();
      renderFooter();
      renderSocial();
      initAnimations();
    })();
  </script>

</body>

</html>
