<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <title>Cheese Collection - The Sleeping Cat Farm</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/sections.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body class="inner-page">

<!-- NAV -->
<nav id="navbar" class="scrolled">
  <a href="../index.html" class="nav-logo-wrapper">
    <img src="../assets/icons/farm-logo.svg" alt="The Sleeping Cat Farm Logo" class="nav-logo-icon">
    <div class="nav-logo"></div>
  </a>
  <ul class="nav-links" id="nav-links"></ul>
</nav>

<!-- PAGE HERO -->
<section class="page-hero" style="padding-bottom: 20px;">
  <h2 class="section-title" style="margin-top: 20px;">Explore our <em>Cheese</em> Collection</h2>
  <p  class="section-desc" style="margin-bottom: 20px;">Each variety has its own story, its own temperament, its own moment to shine. Discover our complete collection of hand-crafted artisanal cheeses.</p>
  <div style="padding: var(--space-xl) var(--space-lg); background: var(--cream); padding-top: 50px;">
    <div class="cheese-grid" id="cheese-grid" style="grid-template-columns: repeat(3, 1fr);"></div>
  </div>
</section>

<!-- FOOTER -->
<footer id="contact">
  <div class="footer-bottom">
    <span id="footer-copyright"></span>
    <div  class="social-links" id="footer-social-logo"></div>
  </div>
</footer>

<!-- SCRIPTS -->
<script src="../js/config.js"></script>
<script src="../js/render.js"></script>
<script src="../js/animations.js"></script>
<script>
(function() {
  // Helper function for WhatsApp links
  function whatsappLink(msg) {
    return `https://wa.me/${SITE_CONFIG.brand.whatsapp}?text=${encodeURIComponent(msg)}`;
  }

  // Render all cheese cards
  const grid = document.getElementById('cheese-grid');
  grid.innerHTML = SITE_CONFIG.products.map(product => {
    const detailUrl = `product-${product.slug}.html`;
    const wpMsg = `I am interested in ordering ${product.name.replace(/&amp;/g,'&')}. Please share availability and delivery details.`;
    const wpLink = whatsappLink(wpMsg);

    const imgInner = product.image
      ? `<img src="${product.image}" alt="${product.name}" class="card-photo"
            onerror="this.style.display='none';this.nextElementSibling.style.display='block';this.nextElementSibling.nextElementSibling.style.display='block';" />
         <div class="card-bg" style="display:none;"></div>
         <div class="cheese-wheel" style="display:none;"></div>`
      : `<div class="card-bg"></div><div class="cheese-wheel"></div>`;

    return `<a href="${detailUrl}" class="cheese-card card-${product.cardStyle} reveal" style="text-decoration:none; color:inherit;">
              <div class="cheese-card-img">${imgInner}</div>
              <div class="cheese-card-body">
                <div class="cheese-type">${product.type}</div>
                <h3>${product.name}</h3>
                <p>${product.desc}</p>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:.3rem;">
                  <span class="price">${product.price}</span>
                  <a href="${wpLink}" target="_blank" rel="noopener noreferrer"
                     class="btn-whatsapp" style="padding:.55rem 1rem; font-size:.6rem;"
                     onclick="event.stopPropagation();">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.01 15.38c-1.23-.58-2.67-1.13-3.01-1.75-.34-.62.17-1.39.61-1.67C15.3 8.59 13 5.42 13 5.42c-.08-.12-.33-.03-.61.11-.28.14-.76.39-.76.39C8.71 3.53 5 4 5 4S.18 3.82.01 9.08 3.01 18 3.01 18s5.73 6.49 11.62 5.38c5.89-1.11 5.74-7.9 5.74-7.9s.83-.92-1.36-1.1zM9.25 6.61l1.75 4.13-2.7.58L9.25 6.61z"/></svg>
                    Order
                  </a>
                </div>
              </div>
            </a>`;
  }).join('');

  // Shared renders
  renderProductsHTML();
  renderBrand();
  renderNav();
  renderFooter();
  renderSocial();
  initAnimations();
})();
</script>

</body>
</html>
