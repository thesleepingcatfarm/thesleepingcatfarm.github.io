<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <title>Your Cart — The Sleeping Cat Farm</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/sections.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
</head>

<body class="inner-page">

    <!-- NAV -->
    <nav id="navbar" class="scrolled">
        <a href="../index.html" class="nav-logo-wrapper">
            <img src="../assets/icons/farm-logo.svg" alt="The Sleeping Cat Farm Logo" class="nav-logo-icon">
            <div class="nav-logo"></div>
        </a>
        <ul class="nav-links" id="nav-links"></ul>
        <button class="nav-hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </nav>
    <div class="nav-overlay"></div>

    <!-- PAGE HERO -->
    <section class="page-hero" style="padding-bottom: 20px;">
        <div class="section-label">Your Selection</div>
        <h2 class="section-title" style="margin-top: 10px;">Shopping<br><em>Cart</em></h2>
    </section>

    <!-- CART CONTENT -->
    <section class="cart-page" id="cart-page">
        <!-- Populated by JS -->
    </section>

    <!-- FOOTER -->
    <footer id="contact">
        <div class="footer-bottom">
            <span id="footer-copyright"></span>
            <div class="social-links" id="footer-social-logo"></div>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="../js/config.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/render.js"></script>
    <script src="../js/animations.js"></script>
    <script>
        (function () {
            renderBrand();
            renderNav();
            renderFooter();
            renderSocial();
            initAnimations();

            renderCartPage();
        })();

        function renderCartPage() {
            const container = document.getElementById('cart-page');
            const items = Cart.getItems();

            if (items.length === 0) {
                container.innerHTML = `
      <div class="cart-empty">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <h3>Your cart is empty</h3>
        <p>Looks like you haven't added any cheeses yet. Browse our collection and find something you love.</p>
        <a href="cheese-collection.html" class="btn-primary" style="margin-top:1rem;">Browse Cheeses</a>
      </div>`;
                return;
            }

            const total = Cart.getTotal();

            const miniGradients = {
                aged: 'linear-gradient(160deg, #8b9d7e 0%, #5a6852 100%)',
                fresh: 'linear-gradient(160deg, #b8d4a8 0%, #87a578 100%)',
                blue: 'linear-gradient(160deg, #7a8b8a 0%, #52615e 100%)',
                goat: 'linear-gradient(160deg, #a8b89a 0%, #798766 100%)',
                smoke: 'linear-gradient(160deg, #7a7968 0%, #52554a 100%)',
                cream: 'linear-gradient(160deg, #c9d4bb 0%, #9caa8c 100%)',
            };

            container.innerHTML = `
    <div class="cart-items">
      ${items.map(item => {
                const unitPrice = parseInt(item.price.replace(/[^0-9]/g, ''), 10) || 0;
                const subtotal = unitPrice * item.qty;
                const bg = miniGradients[item.cardStyle] || miniGradients.aged;
                return `
          <div class="cart-item" data-slug="${item.slug}">
            <div class="cart-item-visual" style="background: ${bg};"></div>
            <div class="cart-item-info">
              <div class="cart-item-type">${item.type || ''}</div>
              <h4 class="cart-item-name">${item.name}</h4>
              <div class="cart-item-weight">${item.weight || ''}</div>
              <div class="cart-item-price">${item.price} each</div>
            </div>
            <div class="cart-item-controls">
              <div class="cart-qty">
                <button class="cart-qty-btn" onclick="changeQty('${item.slug}', -1)">−</button>
                <span class="cart-qty-value">${item.qty}</span>
                <button class="cart-qty-btn" onclick="changeQty('${item.slug}', 1)">+</button>
              </div>
              <div class="cart-item-subtotal">₹ ${subtotal}</div>
              <button class="cart-remove-btn" onclick="removeCartItem('${item.slug}')" aria-label="Remove">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                </svg>
              </button>
            </div>
          </div>`;
            }).join('')}
    </div>

    <div class="cart-summary">
      <div class="cart-summary-inner">
        <h3>Order Summary</h3>
        <div class="cart-summary-row">
          <span>Items (${Cart.getCount()})</span>
          <span>₹ ${total}</span>
        </div>
        <div class="cart-summary-row cart-summary-total">
          <span>Total</span>
          <span>₹ ${total}</span>
        </div>
        <button class="btn-whatsapp" style="width:100%; justify-content:center; margin-top:1.2rem;" onclick="checkoutWhatsApp()">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>
          Checkout via WhatsApp
        </button>
        <a href="cheese-collection.html" class="cart-continue-link">← Continue Shopping</a>
      </div>
    </div>`;
        }

        function changeQty(slug, delta) {
            const items = Cart.getItems();
            const item = items.find(i => i.slug === slug);
            if (item) {
                Cart.updateQty(slug, item.qty + delta);
                renderCartPage();
            }
        }

        function removeCartItem(slug) {
            Cart.removeItem(slug);
            renderCartPage();
        }

        function checkoutWhatsApp() {
            const url = Cart.getWhatsAppCheckoutURL();
            if (url) {
                window.open(url, '_blank');
            }
        }
    </script>

</body>

</html>
