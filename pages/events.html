<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <title>Events & Workshops — The Sleeping Cat Farm</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/sections.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>

<body class="inner-page">

  <!-- NAV -->
  <nav id="navbar" class="scrolled">
    <a href="../index.html" class="nav-logo-wrapper">
      <img src="../assets/icons/farm-logo.svg" alt="The Sleeping Cat Farm Logo" class="nav-logo-icon">
      <div class="nav-logo"></div>
    </a>
    <ul class="nav-links" id="nav-links"></ul>
    <button class="nav-hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>
  <div class="nav-overlay"></div>

  <!-- PAGE HERO -->
  <section class="page-hero">
    <div class="section-label">On the Farm</div>
    <h2 class="section-title">Events &amp;<br><em>Workshops</em></h2>
    <p class="section-desc" style="margin-bottom: 0.5rem">Join us for hands-on cheesemaking workshops, guided tastings, and intimate farm evenings.
      Something for every cheese lover.</p>
  </section>



  <!-- EVENT DETAIL (expanded, shown below the listing) -->
  <div id="event-details" style="padding-bottom: 20px;">
    <!-- Populated by JS for each event -->
  </div>

  <!-- FOOTER -->
  <footer id="contact">
    <div class="footer-bottom">
      <span id="footer-copyright"></span>
      <div class="social-links" id="footer-social-logo"></div>
    </div>
  </footer>

  <!-- SCRIPTS -->
  <script src="../js/config.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/render.js"></script>
  <script src="../js/animations.js"></script>
  <script>
    (function () {
      const events = SITE_CONFIG.events;

      // ─── Event detail sections ───
      const detailsEl = document.getElementById('event-details');
      detailsEl.innerHTML = events.map(ev => {
        const wpLink = `https://wa.me/${SITE_CONFIG.brand.whatsapp}?text=${encodeURIComponent(ev.whatsappMsg)}`;
        return `<section id="event-detail-${ev.slug}" class="event-detail-section" style="background:var(--cream-dark); padding-top:var(--space-xl);">
              <div style="max-width:780px; margin:0 auto; padding:0 var(--space-lg) var(--space-xl);">
                <div class="event-card reveal" style="margin: 0.1rem;">
                  <img src="${ev.image}" alt="${ev.title}" class="event-image">
                </div>

                <div class="section-label" style="text-align:left; padding-top: 1.5rem">${ev.category}</div>
                <h2>${ev.title}</h2>

                <div class="event-detail-meta">
                  <div><strong>Date</strong><p>${ev.date}</p></div>
                  <div><strong>Time</strong><p>${ev.time}</p></div>
                  <div><strong>Location</strong><p>${ev.location}</p></div>
                  <div><strong>Price</strong><p>${ev.price}</p></div>
                </div>

                <p class="event-long-desc">${ev.longDesc}</p>

                <h4 style="font-family:var(--font-serif); font-size:1.1rem; font-weight:500; color:var(--deep-brown); margin-bottom:.8rem; padding-bottom:.4rem; border-bottom:1px solid var(--cream-dark);">What's Included</h4>
                <ul class="event-highlights">
                  ${ev.highlights.map(h => `<li>${h}</li>`).join('')}
                </ul>

                <a href="${wpLink}" target="_blank" rel="noopener noreferrer" class="btn-whatsapp" style="width:100%; justify-content:center; margin-top:1.2rem;">
                  <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                  </svg>
                  Book via WhatsApp
                </a>

                <a href="../index.html" style="align-content: center; justify-content:center; display:inline-block;  font-size:.72rem; color:var(--text-muted); text-decoration:none; letter-spacing:.1em; text-transform:uppercase;">← Back to Home</a>
              </div>
            </section>`;
      }).join('');

      // Shared renders
      renderBrand();
      renderNav();
      renderFooter();
      renderSocial();
      initAnimations();
    })();
  </script>

</body>

</html>
