<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <title>Product — The Sleeping Cat Farm</title>  <!-- overwritten by JS -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/sections.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body class="inner-page">

<!-- NAV -->
<nav id="navbar" class="scrolled">
  <a href="../index.html" class="nav-logo-wrapper">
    <img src="../assets/icons/farm-logo.svg" alt="The Sleeping Cat Farm Logo" class="nav-logo-icon">
    <div class="nav-logo"></div>
  </a>
  <ul class="nav-links" id="nav-links"></ul>
</nav>

<!-- PRODUCT DETAIL HERO WRAPPER -->
<div class="product-detail-hero" style="margin-top: 50px; padding-bottom: 30px;" >
  <div class="product-detail-layout">

    <!-- LEFT: Photo Gallery -->
    <div class="product-gallery" id="product-gallery">
      <!-- Populated by JS -->
    </div>

    <!-- RIGHT: Product Info -->
    <div class="product-info" id="product-info">
      <!-- Populated by JS -->
    </div>

  </div>
</div>

<!-- RELATED / YOU MAY ALSO LIKE (simple row of other products) -->

<section class="product-row-section" style="padding-top: var(--space-xl);">
  <div class="product-row-header reveal" style="max-width:1100px; margin:0 auto 2rem; padding:0 var(--space-lg);">
    <h2 class="section-title">You May Also<br><em>Like</em></h2>
  </div>
  <div class="product-row" id="related-products-grid" style="max-width:1100px; margin:0 auto; padding:0 var(--space-lg);"></div>
</section>

<!-- FOOTER -->
<footer id="contact">
  <div class="footer-bottom">
    <span id="footer-copyright"></span>
    <div  class="social-links" id="footer-social-logo"></div>
  </div>
</footer>

<!-- SCRIPTS -->
<script src="../js/config.js"></script>
<script src="../js/render.js"></script>
<script src="../js/animations.js"></script>
<script>
(function() {
  // ─── Determine which product to show from the filename ───
  const filename = window.location.pathname.split('/').pop(); // e.g. "product-dozing-gold.html"
  const slug     = filename.replace('product-', '').replace('.html', '');
  const product  = SITE_CONFIG.products.find(p => p.slug === slug);

  if (!product) {
    document.title = 'Product Not Found';
    document.querySelector('.product-detail-hero').innerHTML =
      '<p style="text-align:center; padding:4rem; color:#999;">Product not found. <a href="../index.html">← Back to shop</a></p>';
    renderBrand(); renderNav(); renderFooter(); renderSocial();
    initAnimations();
    return;
  }

  // ─── Page title ───
  document.title = `${product.name.replace(/&amp;/g,'&')} — The Sleeping Cat Farm`;

  // ─── Build WhatsApp link ───
  const wpMsg  = `I am interested in ordering ${product.name.replace(/&amp;/g,'&')}. Please share availability and delivery details.`;
  const wpLink = `https://wa.me/${SITE_CONFIG.brand.whatsapp}?text=${encodeURIComponent(wpMsg)}`;

  // ─── Photo Gallery ───
  // We generate 3 "virtual" thumbnails using slight gradient variations for demo
  // In production, replace with actual product.photos array
  const galleryEl = document.getElementById('product-gallery');
  const thumbCount = 3;

  galleryEl.innerHTML =
    `<div class="product-gallery-main gallery-${product.cardStyle}">
       <div class="gallery-bg"></div>
       <div class="gallery-wheel"></div>
     </div>
     <div class="product-gallery-thumbs">
       ${Array.from({length: thumbCount}, (_, i) =>
         `<div class="thumb thumb-${product.cardStyle} ${i === 0 ? 'active' : ''}" onclick="setActiveThumb(this)">
            <div class="thumb-bg" style="filter: ${i === 1 ? 'brightness(0.9)' : i === 2 ? 'brightness(1.08) saturate(1.2)' : 'none'};"></div>
          </div>`
       ).join('')}
     </div>`;

  // ─── Product Info ───
  const infoEl = document.getElementById('product-info');
  infoEl.innerHTML =
    `<!-- Breadcrumb -->
     <div class="breadcrumb">
       <a href="../index.html">Home</a><span>/</span>
       <a href="../index.html#collection">Our Cheese</a><span>/</span>
       <strong>${product.name}</strong>
     </div>

     <!-- Type & Name -->
     <div class="product-type">${product.type}</div>
     <h1 class="product-name">${product.name}</h1>
     <div class="product-price">${product.price}</div>
     <p  class="product-desc">${product.desc}</p>

     <!-- Meta row -->
     <div class="product-meta">
       <div class="product-meta-item">
         <div class="meta-label">Weight</div>
         <div class="meta-value">${product.weight}</div>
       </div>
       <div class="product-meta-item">
         <div class="meta-label">Best Within</div>
         <div class="meta-value">${product.bestWithin}</div>
       </div>
       <div class="product-meta-item">
         <div class="meta-label">Rennet</div>
         <div class="meta-value">${product.rennet}</div>
       </div>
     </div>

     <!-- WhatsApp CTA -->
     <a href="${`https://wa.me/${SITE_CONFIG.brand.whatsapp}?text=${encodeURIComponent(wpMsg)}`}"
        target="_blank" rel="noopener noreferrer" class="btn-whatsapp">
        Order via WhatsApp
     </a>

     <!-- Accordion Sections -->
     <div class="detail-accordion">

       <!-- NUTRITION -->
       <div class="detail-accordion-item">
         <button class="detail-accordion-btn">
           Nutrition Info <span class="accordion-icon">+</span>
         </button>
         <div class="detail-accordion-body">
           <div class="accordion-content">
             <p style="margin-bottom:.6rem; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gold);">Nutritional Information per 100g</p>
             <div class="nutrition-grid">
               <div class="nutrition-item"><div class="n-value">${product.nutrition.energy}</div><div class="n-label">Energy</div></div>
               <div class="nutrition-item"><div class="n-value">${product.nutrition.carbs}</div><div class="n-label">Carbs</div></div>
               <div class="nutrition-item"><div class="n-value">${product.nutrition.fat}</div><div class="n-label">Fat</div></div>
               <div class="nutrition-item"><div class="n-value">${product.nutrition.protein}</div><div class="n-label">Protein</div></div>
               <div class="nutrition-item"><div class="n-value">${product.nutrition.sodium}</div><div class="n-label">Sodium</div></div>
             </div>
           </div>
         </div>
       </div>

       <!-- HOW TO ENJOY -->
       <div class="detail-accordion-item">
         <button class="detail-accordion-btn">
           How to Enjoy <span class="accordion-icon">+</span>
         </button>
         <div class="detail-accordion-body">
           <div class="accordion-content">
             <p>${product.howToEnjoy}</p>
           </div>
         </div>
       </div>

       <!-- PAIRINGS -->
       <div class="detail-accordion-item">
         <button class="detail-accordion-btn">
           Pairings <span class="accordion-icon">+</span>
         </button>
         <div class="detail-accordion-body">
           <div class="accordion-content">
             <p style="margin-bottom:.5rem;"><strong style="color:var(--deep-brown);">Condiments & Crackers</strong></p>
             <div class="pairing-tags">
               ${product.pairings.condiments.map(c => `<span class="pairing-tag">${c}</span>`).join('')}
             </div>
             <p style="margin-top:1rem; margin-bottom:.5rem;"><strong style="color:var(--deep-brown);">Wine Pairing</strong></p>
             <p>${product.pairings.wine}</p>
           </div>
         </div>
       </div>

       <!-- HOW TO STORE -->
       <div class="detail-accordion-item">
         <button class="detail-accordion-btn">
           How to Store <span class="accordion-icon">+</span>
         </button>
         <div class="detail-accordion-body">
           <div class="accordion-content">
             <ul>
               ${product.storage.map(tip => `<li>${tip}</li>`).join('')}
             </ul>
           </div>
         </div>
       </div>

     </div>`;

  // ─── Related Products (show up to 4 other products) ───
  const related = SITE_CONFIG.products.filter(p => p.slug !== slug).slice(0, 4);
  const relatedGrid = document.getElementById('related-products-grid');
  relatedGrid.innerHTML = related.map(p => {
    return `<a href="product-${p.slug}.html" class="product-mini-card mini-${p.cardStyle} reveal" style="text-decoration:none; color:inherit;">
              <div class="mini-card-img">
                <div class="mini-card-bg"></div>
                <div class="mini-wheel"></div>
              </div>
              <div class="mini-card-body">
                <div class="mini-type">${p.type}</div>
                <h4>${p.name}</h4>
                <div class="mini-price">${p.price}</div>
              </div>
            </a>`;
  }).join('');

  // ─── Render shared sections ───
  renderBrand();
  renderNav();
  renderFooter();
  renderSocial();
  initAnimations();

})();

/* Thumb switcher */
function setActiveThumb(el) {
  el.closest('.product-gallery-thumbs').querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

</script>

</body>
</html>
