<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <title>Recipes — The Sleeping Cat Farm</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/sections.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body class="inner-page">

<!-- NAV -->
<nav id="navbar" class="scrolled">
  <a href="../index.html" class="nav-logo-wrapper">
    <img src="../assets/icons/farm-logo.svg" alt="The Sleeping Cat Farm Logo" class="nav-logo-icon">
    <div class="nav-logo"></div>
  </a>
  <ul class="nav-links" id="nav-links"></ul>
</nav>

<!-- PAGE HERO -->
<section class="page-hero">
  <div class="section-label">In the Kitchen</div>
  <h2 class="section-title">Cooking With<br><em>The Farm</em></h2>
  <p  class="section-desc">Simple, flavourful recipes that let our artisan cheeses shine. From quick weeknight dinners to show-stopping entertaining dishes.</p>
</section>

<!-- RECIPES GRID -->
<div class="recipes-grid" id="recipes-grid">
  <!-- Populated by JS -->
</div>

<!-- FOOTER -->
<footer id="contact">
  <div class="footer-bottom">
    <span id="footer-copyright"></span>
    <div  class="social-links" id="footer-social-logo"></div>
  </div>
</footer>

<!-- SCRIPTS -->
<script src="../js/config.js"></script>
<script src="../js/render.js"></script>
<script src="../js/animations.js"></script>
<script>
(function() {
  const grid = document.getElementById('recipes-grid');
  grid.innerHTML = SITE_CONFIG.recipes.map(r =>
    `<a href="recipe-${r.slug}.html" class="recipe-card reveal" style="text-decoration:none; color:inherit;">
       <div class="recipe-card-visual">
         <div class="recipe-wheel"></div>
       </div>
       <div class="recipe-card-body">
         <div class="recipe-meta">
           <span>${r.category}</span>
           <span>⏱ ${r.time}</span>
           <span>👤 Serves ${r.servings}</span>
         </div>
         <h3>${r.title}</h3>
         <p>${r.intro}</p>
       </div>
     </a>`
  ).join('');

  renderBrand();
  renderNav();
  renderFooter();
  renderSocial();
  initAnimations();
})();
</script>

</body>
</html>
