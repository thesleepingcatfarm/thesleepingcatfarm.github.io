<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <title>Cheese Subscription — The Sleeping Cat Farm</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/sections.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>

<body class="inner-page">

  <!-- NAV -->
  <nav id="navbar" class="scrolled">
    <a href="../index.html" class="nav-logo-wrapper">
      <img src="../assets/icons/farm-logo.svg" alt="The Sleeping Cat Farm Logo" class="nav-logo-icon">
      <div class="nav-logo"></div>
    </a>
    <ul class="nav-links" id="nav-links"></ul>
    <button class="nav-hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>
  <div class="nav-overlay"></div>

  <!-- PAGE HERO -->
  <section class="page-hero">
    <div class="section-label">Monthly Box</div>
    <h2 class="section-title" id="sub-page-title"></h2>
    <p class="section-desc" id="sub-page-desc"></p>
  </section>

  <!-- SUBSCRIPTION TIERS -->
  <div class="subscription-tiers" id="subscription-tiers">
    <!-- Populated by JS -->
  </div>

  <!-- SUBSCRIPTION FORM -->
  <section class="subscription-form-section">
    <div class="subscription-form">
      <h2 class="section-title" style="margin-bottom:.4rem;" id="sub-form-heading"></h2>
      <p class="section-desc" style="margin-bottom:2rem;" id="sub-form-desc"></p>

      <form id="subscription-form">
        <div class="form-row">
          <input type="text" id="sf-name" placeholder="Your Full Name" required />
        </div>
        <div class="form-row">
          <input type="email" id="sf-email" placeholder="Your Email Address" required />
        </div>
        <div class="form-row">
          <input type="tel" id="sf-phone" placeholder="Phone Number" required />
        </div>
        <div class="form-row">
          <select id="sf-tier">
            <option value="" disabled selected>Choose a subscription tier…</option>
            <!-- Options populated by JS -->
          </select>
        </div>
        <div class="form-row">
          <input type="text" id="sf-address" placeholder="Delivery City / Pincode" required />
        </div>
        <button type="submit" class="btn-primary" style="width:100%; text-align:center; margin-top:.5rem;">Send My
          Subscription Request</button>
        <p class="form-note">We will review your request and send you all the details via WhatsApp within 24 hours. No
          payment is required at this stage.</p>
      </form>
    </div>
  </section>

  <!-- FOOTER -->
  <footer id="contact">
    <div class="footer-bottom">
      <span id="footer-copyright"></span>
      <div class="social-links" id="footer-social-logo"></div>
    </div>
  </footer>

  <!-- SCRIPTS -->
  <script src="../js/config.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/render.js"></script>
  <script src="../js/animations.js"></script>
  <script>
    (function () {
      const sub = SITE_CONFIG.subscription;
      const page = sub.page;

      // Hero
      document.getElementById('sub-page-title').innerHTML = page.heroTitle;
      document.getElementById('sub-page-desc').textContent = page.heroDesc;

      // Tiers
      const tiersEl = document.getElementById('subscription-tiers');
      tiersEl.innerHTML = page.tiers.map(tier =>
        `<div class="tier-card ${tier.highlight ? 'highlight' : ''} reveal">
       <h3>${tier.name}</h3>
       <div class="tier-price">${tier.price}</div>
       <div class="tier-weight">${tier.cheeses} cheeses · ${tier.weight}</div>
       <ul>
         ${tier.perks.map(p => `<li>${p}</li>`).join('')}
       </ul>
     </div>`
      ).join('');

      // Form heading
      document.getElementById('sub-form-heading').textContent = page.formHeading;
      document.getElementById('sub-form-desc').textContent = page.formDesc;

      // Populate tier select options
      const select = document.getElementById('sf-tier');
      page.tiers.forEach(tier => {
        const opt = document.createElement('option');
        opt.value = tier.name;
        opt.textContent = `${tier.name} — ${tier.price}`;
        select.appendChild(opt);
      });

      // Shared renders
      renderBrand();
      renderNav();
      renderFooter();
      renderSocial();
      initAnimations();
    })();

    document.addEventListener('DOMContentLoaded', function () {
      const subscriptionForm = document.getElementById('subscription-form');

      if (subscriptionForm) {
        subscriptionForm.addEventListener('submit', function (e) {
          e.preventDefault();

          const name = document.getElementById('sf-name').value;
          const email = document.getElementById('sf-email').value;
          const phone = document.getElementById('sf-phone').value;
          const tier = document.getElementById('sf-tier').value;
          const address = document.getElementById('sf-address').value;

          // Create WhatsApp message
          const whatsappMessage = `*New Subscription Request*\n\nName: ${name}\nEmail: ${email}\nPhone: ${phone}\nSubscription Tier: ${tier}\nDelivery Location: ${address}\n\nPlease send me the subscription details!`;

          // Construct WhatsApp URL
          const whatsappURL = `https://wa.me/${SITE_CONFIG.brand.whatsapp}?text=${encodeURIComponent(whatsappMessage)}`;

          // Open WhatsApp in new tab
          window.open(whatsappURL, '_blank');

          // Reset form
          subscriptionForm.reset();

          // Show success message
          alert('Thank you for your subscription request! You will be redirected to WhatsApp to complete your request.');
        });
      }
    });

  </script>

</body>

</html>
